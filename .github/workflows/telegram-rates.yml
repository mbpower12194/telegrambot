name: ارسال نرخ‌ها به تلگرام

# هر ۴ ساعت در بازه‌ی بیداری: ۸ صبح، ۱۲ ظهر، ۴ بعدازظهر و ۸ شب به وقت تهران
# تهران = UTC+3:30 → ۰۸:۰۰ = ۰۴:۳۰ | ۱۲:۰۰ = ۰۸:۳۰ | ۱۶:۰۰ = ۱۲:۳۰ | ۲۰:۰۰ = ۱۶:۳۰
#
# ⚠️ مهم: کرانِ گیت‌هاب تضمینی نیست و در ساعت‌های شلوغ تأخیر می‌خورد.
# راهکار: کران را ۲۵ دقیقه زودتر می‌زنیم و خودِ اسکریپت تا رسیدن به
# سرِ ساعت صبر می‌کند. پس تا ۲۵ دقیقه تأخیرِ گیت‌هاب هم پیام دقیقاً
# روی ۰۸:۰۰ / ۱۲:۰۰ / ۱۶:۰۰ / ۲۰:۰۰ می‌رسد.
# نکته: دقیقه‌ی غیررُند (۰۵) عمداً انتخاب شده — صف گیت‌هاب روی
# دقیقه‌های ۰۰/۱۵/۳۰ شلوغ‌ترین حالت را دارد.
on:
  schedule:
    - cron: "05 4,8,12,16 * * *"
  workflow_dispatch:      # دکمه «Run workflow» برای اجرای دستی
  push:                   # با هر آپلود/تغییر کد، یک اجرای آزمایشی انجام می‌شود
    branches: [main]
    paths:
      - "rates_bot.py"
      - ".github/workflows/telegram-rates.yml"

# اگر اجرای قبلی تمام نشده، اجرای جدید جایگزینش شود
concurrency:
  group: telegram-rates
  cancel-in-progress: false

jobs:
  send-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # تا ۳۵ دقیقه صبر برای هم‌ترازی با سرِ ساعت + حاشیه
    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: نصب پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: بررسی وجود سکرت‌ها
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          ok=1
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::error::سکرت TELEGRAM_TOKEN تعریف نشده است (Settings → Secrets and variables → Actions)."; ok=0
          else
            echo "✅ TELEGRAM_TOKEN موجود است (طول: ${#TELEGRAM_TOKEN})"
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "::error::سکرت CHAT_ID تعریف نشده است."; ok=0
          else
            echo "✅ CHAT_ID موجود است (طول: ${#CHAT_ID})"
          fi
          [ "$ok" = "1" ] || exit 1

      - name: تست اتصال به تلگرام
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          res=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe")
          if echo "$res" | grep -q '"ok":true'; then
            echo "✅ توکن معتبر است: $(echo "$res" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["username"])')"
          else
            echo "::error::توکن تلگرام نامعتبر است → $res"; exit 1
          fi

      - name: ارسال نرخ‌ها به تلگرام
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          # فقط اجرای زمان‌بندی‌شده منتظر سرِ ساعت می‌ماند؛
          # اجرای دستی و اجرای پس از push باید فوری بفرستد.
          NO_ALIGN: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: python3 rates_bot.py --once
