name: ارسال نرخ‌ها به تلگرام

# هر ۶ ساعت: ساعت‌های ۳ بامداد، ۹ صبح، ۳ بعدازظهر و ۹ شب به وقت تهران
# تهران = UTC+3:30 → ۳:۰۰ = ۲۳:۳۰ (روز قبل) | ۹:۰۰ = ۰۵:۳۰ | ۱۵:۰۰ = ۱۱:۳۰ | ۲۱:۰۰ = ۱۷:۳۰
on:
  schedule:
    - cron: "30 5,11,17,23 * * *"
  workflow_dispatch: # دکمه «Run workflow» برای اجرای دستی (نرخ همان لحظه فرستاده می‌شود)

jobs:
  send-rates:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ارسال نرخ‌ها به تلگرام
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 rates_bot.py --once
