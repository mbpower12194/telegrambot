name: ارسال نرخ‌ها به تلگرام

# هر ۱۲ ساعت: ساعت ۹ صبح و ۹ شب به وقت تهران
# ۰۹:۰۰ تهران = ۰۵:۳۰ UTC  |  ۲۱:۰۰ تهران = ۱۷:۳۰ UTC
on:
  schedule:
    - cron: "30 5,17 * * *"
  workflow_dispatch: # دکمه «Run workflow» برای اجرای دستی

jobs:
  send-rates:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ارسال نرخ‌ها به تلگرام
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 rates_bot.py --once
